# 위밋(WE-Meet) 회의비 증빙 검수 기준값
# ※ 담당자 확정 답변 대기 중인 잠정값이다. 확정되면 이 파일만 고치면 된다 (코드 수정 불필요).
program: 위밋

# C7 1인당 한도 (원)
per_person_limit: 20000

# C12 가맹점 주소가 이 지역이어야 한다. any_of 중 하나라도 주소에 들어 있으면 충족.
# ambiguous 단어만 있고 any_of가 없으면(예: '북구'만 적힘 — 대구·부산·울산에도 북구가 있음) 확인필요.
region:
  label: 광주광역시 북구
  any_of: ["광주광역시 북구", "광주 북구", "광주시 북구"]
  ambiguous: ["북구"]

# C13 결제 시각이 이 시각 '이전'이어야 한다 (같은 시각은 미충족)
pay_before: "20:00"

# C14 회의 종료 후 이 시간(분) 안에 결제해야 한다
max_minutes_after_meeting: 60

# C15 결제수단
card_words: ["신용카드", "체크카드", "카드"]
cash_words: ["현금", "계좌이체", "이체", "무통장"]

# C9 회의내용: 이 길이(글자, 공백 제외) 미만이면 구체성이 부족할 수 있어 확인필요 (오프라인 규칙)
content_min_chars: 40

# C9 양식 안내문이 남아 있는지 찾는 문구 (하나라도 있으면 '안내문 미삭제')
guide_phrases:
  - "안내사항 숙지 후"
  - "회의일시와 회의비 영수증 날짜가 동일해야"
  - "1인당 2만원에 한하여"
  - "회의장소: 음식점, 카페X"
  - "참석인원 모두 나오게 촬영"
  - "해당 내용은 지우고"

# 항목별 미충족 시 등급 (부적합: 회의비로 인정 불가 / 보완필요: 서류 고쳐 다시 제출)
severity:
  C1: 보완필요
  C2: 참고
  C3: 보완필요
  C4: 보완필요
  C5: 부적합
  C6: 보완필요
  C7: 부적합
  C8: 부적합
  C9: 보완필요
  C10: 보완필요
  C11: 보완필요
  C12: 부적합
  C13: 부적합
  C14: 부적합
  C15: 부적합
  C16: 보완필요
