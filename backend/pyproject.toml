[project]
name = "meeting-fee-review-backend"
version = "0.1.0"
description = "인공지능혁신융합대학사업단 회의비 증빙(회의록 + 영수증) 자동 검수 백엔드"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    # 문서 읽기 (HWP·HWPX·DOCX·PDF)
    "olefile==0.47",
    "python-docx==1.2.0",
    "lxml==6.1.3",
    "pdfplumber==0.11.10",
    "pypdf==6.19.0",
    "pypdfium2==5.14.0",
    "pillow==12.3.0",
    # Upstage 호출 (Information Extract·Solar는 OpenAI 호환, OCR은 httpx)
    "openai==3.40.0",
    "httpx==0.28.1",
    # 판정 조건·데이터 모델
    "pyyaml==6.0.3",
    "pydantic==2.14.1",
    # 샘플 생성 (tools/)
    "reportlab==5.0.1",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy>=2.1.6",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.32",
    "langgraph>=1.2.19",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
